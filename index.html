<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  	 <!-- Favicon khusus untuk GitHub Pages -->
  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/sdplusarafah/ppdb/refs/heads/main/favicon16.png">

  <link rel="apple-touch-icon"
        href="https://raw.githubusercontent.com/sdplusarafah/ppdb/refs/heads/main/favicon16.png">
  <title>Administrasi Kesiswaan - SD Plus Arafah</title>
  <style>
* {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #f1f5f9; /* Warna latar menyatu dengan aplikasi */
    }
    iframe {
      width: 100%;
      /* Mengatur tinggi iframe agar tetap pas di layar */
      height: calc(100% + 37px);
      /* Dorong iframe ke atas untuk sembunyikan banner Google */
      margin-top: -37px;
      /* Tambahkan padding-top agar isi aplikasi turun dan tidak terpotong */
      padding-top: 37px; 
      border: none;
    }
  </style>
</head>
<body>
  <!-- Ganti URL di bawah dengan URL Deployment Web App Apps Script kamu -->
  <iframe src="https://script.google.com/macros/s/AKfycbw5vYNYhKJYIDCCUCzhupBJOS9PbiSjdRZBglOrFyqNF76zaVKBpFiko1jpyyrYE6OIfQ/exec"></iframe>
</body>
